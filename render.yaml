# Blueprint opcional para Render (https://render.com). Tambien puedes crear el servicio a mano (ver README).
services:
  - type: web
    name: zombie-break-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ALLOWED_ORIGINS
        value: "*"
